<mat-grid-list cols="1" rowHeight="600px">
    <mat-grid-tile>
        <div class="example-container">
            <mat-toolbar class="custom-toolbar mb10" color="primary">User Registration</mat-toolbar>
            <form [formGroup]="registerForm" #formDirective="ngForm"
                (ngSubmit)="onFormSubmit(registerForm, formDirective)" action="post">

                <mat-form-field appearance="fill" class="width-50"  >
                    <mat-icon matPrefix>person_outline</mat-icon>
                    <mat-label>First Name</mat-label>
                    <input matInput placeholder="Enter Here" formControlName="firstName">
                </mat-form-field>

                <mat-form-field appearance="fill" class="width-50 ml-2">
                    <mat-label>Surname</mat-label>
                    <input matInput placeholder="Enter Here" formControlName="lastName">
                </mat-form-field>

                <br>
                <mat-form-field appearance="fill" class="width-50">
                    <mat-icon matPrefix>account_box</mat-icon>
                    <mat-label>Username</mat-label>
                    <input matInput placeholder="Enter Username" formControlName="userName">
                    <mat-error *ngIf="checkValidation('username')">
                        {{ fieldRequired }}
                    </mat-error>
                </mat-form-field>
            

                <mat-form-field appearance="fill" class="width-50 ml-2">
                    <mat-icon matPrefix>email</mat-icon>
                    <mat-label>Email address</mat-label>
                    <input matInput placeholder="Ex. pat@example.com" formControlName="email">
                    <mat-error *ngIf="checkValidation('email')">
                        {{ emailErrors() }}
                    </mat-error>
                </mat-form-field>

                <br>
                <mat-form-field appearance="fill" class="width-50">
                    <mat-icon matPrefix>my_location</mat-icon>
                    <mat-label>Address</mat-label>
                    <input matInput placeholder="Enter Address here.." formControlName="address">
                </mat-form-field>

            
                <mat-form-field appearance="fill" class="width-50 ml-2">
                    <mat-icon matPrefix>phone</mat-icon>
                    <mat-label>Phone</mat-label>
                    <input matInput placeholder="Enter Phone Number.." formControlName="phoneNumber">
                </mat-form-field>
                <br>

                <mat-form-field appearance="fill" class="width-50">
                    <mat-label>Date of Birth:</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="dateOfBirth">
                    <mat-hint>MM/DD/YYYY</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="fill" class="width-50 ml-2">
                    <mat-label>Gender:</mat-label>
                    <mat-select formControlName="gender">
                        <mat-option *ngFor="let gender of genders"
                            [value]="gender.value">{{gender.viewValue}}</mat-option>
                    </mat-select>
                </mat-form-field>

                <br>
                <mat-form-field appearance="fill" class="width-100">
                    <mat-icon matPrefix>lock_outline</mat-icon>
                    <mat-label>Enter password</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
                    <button mat-icon-button matSuffix type="button" (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="checkValidation('password')">
                        {{ getErrorPassword() }}
                    </mat-error>
                </mat-form-field>
                <br>
                <br>
                <mat-checkbox class="example-margin" formControlName="termsAccepted"
                    (change)="onCheckboxChange()">Accepts terms & Conditons</mat-checkbox>
                <br>
                <mat-progress-bar *ngIf="flag" mode="indeterminate"></mat-progress-bar>
                <div class="container text-center mt10">
                    <button type="submit" mat-raised-button color="primary"
                        [disabled]="registerForm.invalid">Register</button>
                    <button type="reset" style="margin-left: 20px;" mat-raised-button color="accent">Clear</button>
                </div>
            </form>
        </div>
    </mat-grid-tile>
</mat-grid-list>
